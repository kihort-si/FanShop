name: Release Workflow

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version from AssemblyInfo.cs
        id: version
        shell: pwsh
        run: |
          $assemblyInfo = Get-Content -Path "AssemblyInfo.cs" -Raw
          $match = [regex]::Match(
            $assemblyInfo,
            '\[assembly:\s*AssemblyVersion\("(?<version>\d+\.\d+\.\d+(?:\.\d+)?)"\)\]'
          )

          if (-not $match.Success) {
            throw "AssemblyVersion was not found in AssemblyInfo.cs."
          }

          $version = $match.Groups["version"].Value
          $tag = "v$version"
          $archiveName = "FanShop$version.zip"

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "archive_name=$archiveName" >> $env:GITHUB_OUTPUT

          Write-Host "Release version: $version"
          Write-Host "Release tag: $tag"
          Write-Host "Archive name: $archiveName"

      - name: Check whether release already exists
        id: existing_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view $env:RELEASE_TAG --repo "${{ github.repository }}" 2>$null

          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $env:RELEASE_TAG already exists. Nothing to publish."
          }
          else {
            "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "Release $env:RELEASE_TAG does not exist and will be created."
          }

          # gh returns 1 when a release does not exist. That result is expected
          # here, so do not propagate its exit code to the GitHub Actions step.
          $global:LASTEXITCODE = 0
          exit 0

      - name: Restore dependencies
        if: steps.existing_release.outputs.exists != 'true'
        run: dotnet restore FanShop.csproj --runtime win-x64

      - name: Publish Windows application
        if: steps.existing_release.outputs.exists != 'true'
        shell: pwsh
        run: |
          dotnet publish FanShop.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            --no-restore `
            --output artifacts/publish

      - name: Add Resources and icon to release files
        if: steps.existing_release.outputs.exists != 'true'
        shell: pwsh
        run: |
          Copy-Item -Path "Resources" `
            -Destination "artifacts/publish/Resources" `
            -Recurse `
            -Force

          Copy-Item -Path "icon.ico" `
            -Destination "artifacts/publish/icon.ico" `
            -Force

      - name: Verify published Windows application
        if: steps.existing_release.outputs.exists != 'true'
        shell: pwsh
        run: |
          $executable = Resolve-Path "artifacts/publish/FanShop.exe"
          $process = Start-Process `
            -FilePath $executable `
            -WorkingDirectory "artifacts/publish" `
            -PassThru

          Start-Sleep -Seconds 10
          $process.Refresh()

          if ($process.HasExited) {
            throw "FanShop.exe exited during the smoke test with code $($process.ExitCode)."
          }

          Stop-Process -Id $process.Id -Force
          $process.WaitForExit()
          Write-Host "FanShop.exe started successfully on Windows."

      - name: Create release archive
        if: steps.existing_release.outputs.exists != 'true'
        shell: pwsh
        env:
          ARCHIVE_NAME: ${{ steps.version.outputs.archive_name }}
        run: |
          $archivePath = Join-Path "artifacts" $env:ARCHIVE_NAME

          Compress-Archive `
            -Path "artifacts/publish/*" `
            -DestinationPath $archivePath `
            -CompressionLevel Optimal

          $entries = [System.IO.Compression.ZipFile]::OpenRead(
            (Resolve-Path $archivePath)
          )

          try {
            $entryNames = $entries.Entries.FullName

            if ("FanShop.exe" -notin $entryNames) {
              throw "FanShop.exe is missing from the release archive."
            }

            if ("icon.ico" -notin $entryNames) {
              throw "icon.ico is missing from the release archive."
            }

            if (-not ($entryNames | Where-Object { $_ -like "Resources/*" })) {
              throw "Resources directory is missing from the release archive."
            }
          }
          finally {
            $entries.Dispose()
          }

          Write-Host "Archive created: $archivePath"

      - name: Create GitHub release
        if: steps.existing_release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: FanShop ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: artifacts/${{ steps.version.outputs.archive_name }}
